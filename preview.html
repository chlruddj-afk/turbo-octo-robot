<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>농사노트 미리보기</title>
<style>
  body{margin:0;background:#2a2d31;font-family:system-ui,sans-serif;display:flex;gap:28px;padding:18px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:8px}
  .lbl{color:#cfd4da;font-size:12px;letter-spacing:.02em}
  .phone{background:#000;border-radius:26px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,.6);position:relative}
  .phone iframe{border:0;display:block;background:#0a0b0c}
</style></head>
<body>
<div class="col"><div class="lbl" id="l1">390 × 844</div><div class="phone" id="p1"><iframe id="f1" src="index.html"></iframe></div></div>
<div class="col"><div class="lbl" id="l2">360 × 800</div><div class="phone" id="p2"><iframe id="f2" src="index.html"></iframe></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const W1 = +(q.get('w') || 390), H1 = +(q.get('h') || 844), Y1 = +(q.get('y') || 0);
  const W2 = +(q.get('w2') || 360), H2 = +(q.get('h2') || 800), Y2 = +(q.get('y2') || 0);
  const tab = q.get('tab') || '', detail = q.get('detail') || '';
  function size(f, p, w, h) { f.style.width = w + 'px'; f.style.height = h + 'px'; p.style.width = w + 'px'; p.style.height = h + 'px'; }
  const f1 = document.getElementById('f1'), f2 = document.getElementById('f2');
  size(f1, document.getElementById('p1'), W1, H1);
  size(f2, document.getElementById('p2'), W2, H2);
  document.getElementById('l1').textContent = W1 + ' × ' + H1 + ' · y=' + Y1 + (tab ? ' · tab=' + tab : '') + (detail ? ' · detail=' + detail : '');
  document.getElementById('l2').textContent = W2 + ' × ' + H2 + ' · y=' + Y2;
  f1.addEventListener('load', () => {
    const w1 = f1.contentWindow;
    try {
      if (tab && typeof w1.setTab === 'function') w1.setTab(tab);
      if (detail && typeof w1.openDetail === 'function') w1.openDetail(detail);
      w1.scrollTo(0, Y1);
    } catch (e) { document.title = 'harnes-error: ' + e.message; }
  });
  f2.addEventListener('load', () => { try { f2.contentWindow.scrollTo(0, Y2); } catch (e) {} });
</script>
</body></html>
